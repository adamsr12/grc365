<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Forms Demo :: Transparent</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
	body {
		background: url("trees.jpg");
		background-repeat: no-repeat;
		background-size: 200%
	} h1 {
        text-align: center;
        font-weight: normal;
    } form {
        width: 600px;
        min-height: 600px;
        padding: 24px;
        background: rgba(255,255,255,0.33);
		backdrop-filter: blur(12px);
        margin: 36px auto;
        border: 1px solid white;
        border-radius: 18px;
        font: 14pt/1.2em 'Roboto Serif';
		color: black;
		text-shadow: 1px 1px 0 white;
    } fieldset {
        margin-top: 18px;
    } #personal input, #submit {
        width: 100%;
        height: 24px;
        margin-bottom: 12px;
	} input[type="text"], textarea {
		width: 98%;
		margin-top: 12px;
		font: 12pt/1.4em Roboto;
	} input:focus {
		box-shadow: 0 0 8px red;
	} select {
		width: 50%;
		font: 12pt/1.4em Roboto;
		padding: 3px;
	}
</style>
</head>

<body>
    <form action="#" method="post">
    <h1>Contact Us</h1>
	<input type="text" placeholder="First name" /><br/>
	<label>First name</label><br/>
	<input type="text" placeholder="Last name" /><br/>
	<label>Last name</label><br/>
	<input type="text" placeholder="Email" /><br/>
	<label>Email</label><br/>
	<fieldset>
	<legend>Operating system</legend>
	<input type="radio" name="OS"><label>Mac OS</label><br/>
	<input type="radio" name="OS"><label>Windows</label><br/>
	</fieldset>
	<fieldset>
	<legend>Services of interest</legend>
	<input type="checkbox"><label>Design services</label><br/>
	<input type="checkbox"><label>Consulting</label><br/>
	<input type="checkbox">
	<label>UX/UI design</label><br/>
	</fieldset>
	<fieldset>
	<legend>Time frame</legend>
	<select>
		<option>ASAP</option>
		<option>This week</option>
		<option>This month</option>
		<option>This year</option>
		<option>Not sure</option>
	</select>
	</fieldset>
	<label>Comments</label><br/>
	<textarea placeholder="Write comments here."></textarea>
    </form>
	<script>
		document.querySelectorAll("input[type='text']").forEach(function(field) {
    field.onfocus = function() {
        this.value = "";
    };
});
	</script>
</body>
</html>
